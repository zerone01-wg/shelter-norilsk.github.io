<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHELTER — Магазин</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #1958ff; --black: #0a0a0a; --gray: #707070; --white: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.6);
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      font-family: "Manrope", sans-serif; 
      background: linear-gradient(135deg, #e0eaff 0%, #f4f6fb 100%);
      color: var(--black);
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    .container { width: min(1240px, calc(100% - 32px)); margin: 0 auto; }

    /* ---------- LOADER ---------- */
    .loader {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: var(--black);
      transition: opacity 0.8s ease 0.4s, visibility 0s ease 1.2s;
    }
    .loader.hidden { opacity: 0; visibility: hidden; }
    
    .loader-logo {
      display: flex; gap: 4px;
      font-family: "Unbounded", sans-serif; font-size: 40px; font-weight: 800;
      letter-spacing: -0.05em; color: var(--white); perspective: 1000px;
    }
    .loader-logo span {
      display: inline-block;
      animation: rotateLetter 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      opacity: 0; transform-origin: center center;
    }
    .loader-logo span:nth-child(1) { animation-delay: 0.1s; }
    .loader-logo span:nth-child(2) { animation-delay: 0.2s; }
    .loader-logo span:nth-child(3) { animation-delay: 0.3s; }
    .loader-logo span:nth-child(4) { animation-delay: 0.4s; }
    .loader-logo span:nth-child(5) { animation-delay: 0.5s; }
    .loader-logo span:nth-child(6) { animation-delay: 0.6s; }
    .loader-logo span:nth-child(7) { animation-delay: 0.7s; }
    @keyframes rotateLetter {
      0% { opacity: 0; transform: rotateY(0deg) scale(0.8); }
      50% { opacity: 1; }
      100% { opacity: 1; transform: rotateY(720deg) scale(1); }
    }

    /* ---------- HEADER ---------- */
    .header { 
      background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); 
      color: var(--white); padding: 20px 0; position: sticky; top: 0; z-index: 50; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    
    .logo { font-family: "Unbounded", sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.08em; }
    
    .nav { display: flex; gap: 15px; align-items: center; }
    
    .home-icon { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); transition: background 0.2s, transform 0.2s; }
    .home-icon:hover { background: var(--blue); transform: translateY(-2px); }
    .home-icon svg { width: 22px; height: 22px; color: var(--white); }
    
    .cart-btn { 
      background: var(--blue); color: var(--white); padding: 12px 24px; border-radius: 12px; 
      font-weight: 800; display: flex; align-items: center; gap: 10px; cursor: pointer; border: none;
      transition: transform 0.2s, background 0.2s; font-size: 15px;
    }
    .cart-btn:hover { transform: translateY(-2px); background: #1045d6; }
    .cart-count { background: var(--white); color: var(--blue); border-radius: 50%; padding: 2px 8px; font-size: 13px; min-width: 24px; text-align: center; }

    /* ---------- HORIZONTAL SCROLL GRID ---------- */
    .scroll-wrapper {
      padding: 40px 0;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
    }
    .scroll-wrapper::-webkit-scrollbar { display: none; } /* Chrome/Safari */
    
    .products-track {
      display: flex;
      gap: 20px;
      width: max-content;
      padding: 0 16px;
    }

    /* Квадратные карточки */
    .product-card { 
      width: 260px;
      height: 380px;
      scroll-snap-align: center;
      background: var(--glass-bg); 
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px; 
      padding: 24px; 
      box-shadow: 0 15px 35px rgba(12, 35, 95, 0.05);
      text-align: center; 
      transition: transform 0.3s var(--ease), box-shadow 0.3s, background 0.3s;
      display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    
    .product-card:hover { 
      transform: translateY(-5px); 
      box-shadow: 0 25px 50px rgba(12, 35, 95, 0.12); 
      background: rgba(255, 255, 255, 0.9); 
    }
    
    .product-img { 
      width: 140px; height: 140px; margin: 0 auto 15px; 
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(240,244,255,0.5));
      border-radius: 24px; display: flex; align-items: center; justify-content: center; 
      font-size: 50px; box-shadow: inset 0 0 20px rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.8);
      overflow: hidden;
    }
    .product-img img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
    
    .product-info {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: center;
    }
    
    .product-title { font-family: "Unbounded", sans-serif; font-size: 16px; margin-bottom: 8px; line-height: 1.2; }
    .product-price { font-size: 20px; font-weight: 800; color: var(--blue); margin-bottom: 15px; }
    
    .discount-badge {
      background: #e6f0ff; color: var(--blue); font-weight: 800; font-size: 11px;
      padding: 6px 12px; border-radius: 8px; margin-bottom: 15px; display: inline-block;
    }

    .qty-controls { 
      display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px;
      background: rgba(255,255,255,0.6); border-radius: 12px; padding: 4px; width: fit-content; margin: 0 auto 15px auto;
      border: 1px solid rgba(0,0,0,0.05);
    }
    .qty-btn { 
      width: 32px; height: 32px; border: none; background: var(--white); 
      font-size: 18px; cursor: pointer; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: background 0.2s, transform 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:active { transform: scale(0.9); }
    .qty-input { width: 30px; text-align: center; font-size: 15px; font-weight: 700; border: none; background: transparent; }
    
    .add-to-cart { 
      width: 100%; padding: 14px; background: var(--blue); color: var(--white); 
      border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 14px;
      transition: background 0.2s, transform 0.2s;
    }
    .add-to-cart:hover { background: #1045d6; transform: translateY(-2px); }

    /* ---------- MODAL (Окно товара) ---------- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: 0.3s; z-index: 200;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    
    .modal-content {
      background: var(--white); border-radius: 24px; width: 90%; max-width: 800px;
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateY(20px); transition: transform 0.3s var(--ease);
      position: relative;
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    
    .modal-close {
      position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.05); border: none;
      width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 24px;
      display: flex; align-items: center; justify-content: center; z-index: 10;
      transition: background 0.2s;
    }
    .modal-close:hover { background: rgba(0,0,0,0.1); }
    
    .modal-body { display: flex; flex-direction: column; }
    @media(min-width: 768px) {
      .modal-body { flex-direction: row; }
      .modal-img-wrap { width: 50%; background: #f4f6fb; display: flex; align-items: center; justify-content: center; padding: 40px; }
      .modal-info { width: 50%; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
    }
    
    .modal-img { max-width: 100%; height: auto; border-radius: 12px; }
    .modal-info h2 { font-family: "Unbounded", sans-serif; font-size: 26px; margin-bottom: 10px; line-height: 1.2; }
    .modal-info .price { font-size: 24px; font-weight: 800; color: var(--blue); margin-bottom: 20px; }
    .modal-info p { color: var(--gray); line-height: 1.6; margin-bottom: 25px; font-size: 15px; }

    /* ---------- CART ---------- */
    .cart-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; justify-content: flex-end; z-index: 100; opacity: 0; transition: opacity 0.3s; }
    .cart-modal.active { display: flex; opacity: 1; }
    
    .cart-content { 
      background: var(--white); width: 400px; max-width: 100%; height: 100%; 
      padding: 30px; display: flex; flex-direction: column; 
      transform: translateX(100%); transition: transform 0.4s var(--ease);
      box-shadow: -10px 0 30px rgba(0,0,0,0.1);
    }
    .cart-modal.active .cart-content { transform: translateX(0); }
    
    .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .close-cart { background: none; border: none; font-size: 32px; cursor: pointer; color: var(--gray); }
    
    .cart-items { flex-grow: 1; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee; font-size: 15px; }
    .remove-item { background: none; border: none; color: #ff4d4d; font-size: 20px; cursor: pointer; margin-left: 10px; }
    
    .cart-total { font-size: 22px; font-weight: 800; margin: 20px 0; display: flex; justify-content: space-between; border-top: 2px solid #eee; padding-top: 20px; }
    .discount-row { font-size: 14px; color: var(--blue); font-weight: 700; margin-bottom: 5px; display: flex; justify-content: space-between; }
    .checkout-btn { background: var(--black); color: var(--white); padding: 18px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; transition: background 0.2s; font-size: 16px; }
    .checkout-btn:hover { background: #333; }

    /* ---------- CHECKOUT ---------- */
    .checkout-section { display: none; padding: 40px 0; max-width: 600px; margin: 0 auto; }
    .checkout-section.active { display: block; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
    .form-group input { width: 100%; padding: 16px; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; font-family: inherit; background: var(--white); transition: border-color 0.2s; }
    .form-group input:focus { outline: none; border-color: var(--blue); }
    .form-group input.error { border-color: #ff4d4d; background-color: #fff0f0; }
    
    .submit-order { background: var(--blue); color: var(--white); padding: 18px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 20px; font-size: 16px; }
  </style>
</head>
<body>

  <!-- LOADER -->
  <div class="loader" id="loader">
    <div class="loader-logo">
      <span>S</span><span>H</span><span>E</span><span>L</span><span>T</span><span>E</span><span>R</span>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">SHELTER</a>
      <div class="nav">
        <!-- Иконка домика -->
        <a href="index.html" class="home-icon" title="На главную">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </a>
        <button class="cart-btn" id="openCart">
          Корзина <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ГОРИЗОНТАЛЬНАЯ ЛЕНТА ТОВАРОВ -->
    <div class="scroll-wrapper" id="productsView">
      <div class="products-track">
        
        <!-- Карточка 1 (Банка) -->
        <div class="product-card" onclick="openModal('can')">
          <div class="product-img">🍫</div>
          <div class="product-info">
            <h3 class="product-title">Протеин SHELTER</h3>
            <div class="product-price">2 600 ₽</div>
            <div class="discount-badge">-10% от 2 шт.</div>
          </div>
          <div class="qty-controls" onclick="event.stopPropagation();">
            <button class="qty-btn" onclick="changeQty('can', -1)">-</button>
            <input type="text" class="qty-input" id="qty-can" value="1" readonly>
            <button class="qty-btn" onclick="changeQty('can', 1)">+</button>
          </div>
          <button class="add-to-cart" onclick="event.stopPropagation(); addToCart('can')">В корзину</button>
        </div>

        <!-- Карточка 2 (Пробник) -->
        <div class="product-card" onclick="openModal('sample')">
          <div class="product-img">🥤</div>
          <div class="product-info">
            <h3 class="product-title">Пробник</h3>
            <div class="product-price">от 100 ₽</div>
          </div>
          <div class="qty-controls" style="flex-direction: column; padding: 5px;" onclick="event.stopPropagation();">
            <select id="sample-type" class="qty-input" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px;">
              <option value="1">1 шт — 100 ₽</option>
              <option value="5">5 шт — 450 ₽</option>
              <option value="10">10 шт — 900 ₽</option>
            </select>
          </div>
          <button class="add-to-cart" onclick="event.stopPropagation(); addToCart('sample')">В корзину</button>
        </div>

        <!-- Карточка 3 (Скоро) -->
        <div class="product-card" style="opacity: 0.6; cursor: default;">
          <div class="product-img">🥛</div>
          <div class="product-info">
            <h3 class="product-title">Ваниль</h3>
            <div class="product-price">Скоро</div>
            <div class="discount-badge">В разработке</div>
          </div>
          <div style="height: 80px; display: flex; align-items: center; justify-content: center; color: var(--gray); font-weight: 700;">Следите за новостями</div>
        </div>

      </div>
    </div>

    <!-- ФОРМА ОФОРМЛЕНИЯ -->
    <div class="checkout-section container" id="checkoutView">
      <h2 style="font-family: 'Unbounded'; margin-bottom: 30px; text-align: center;">Оформление заказа</h2>
      <form id="orderForm">
        <div class="form-group">
          <label>ФИО</label>
          <input type="text" name="name" required placeholder="Иванов Иван Иванович">
        </div>
        <div class="form-group">
          <label>Номер телефона</label>
          <input type="tel" name="phone" required placeholder="+7 (999) 999-99-99">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required placeholder="mail@example.com">
        </div>
        <div class="form-group">
          <label>Адрес проживания</label>
          <input type="text" name="address" required placeholder="Город, улица, дом, квартира">
        </div>
        <button type="submit" class="submit-order">Перейти к оплате</button>
      </form>
    </div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО ТОВАРА -->
  <div class="modal-overlay" id="productModal" onclick="closeModal(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal(event)">×</button>
      <div class="modal-body">
        <div class="modal-img-wrap">
          <img src="images/shelter-protein-chocolate.jpg" alt="SHELTER" class="modal-img" id="modalImg">
        </div>
        <div class="modal-info">
          <h2 id="modalTitle">Название</h2>
          <div class="price" id="modalPrice">0 ₽</div>
          <p id="modalDesc">Описание...</p>
          <button class="add-to-cart" id="modalBtn">Добавить в корзину</button>
        </div>
      </div>
    </div>
  </div>

  <!-- КОРЗИНА -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <div class="cart-header">
        <h3 style="font-family: 'Unbounded';">Корзина</h3>
        <button class="close-cart" id="closeCart">&times;</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      
      <div id="discountInfo" style="display: none;" class="discount-row">
        <span>Скидка 10% на протеин:</span>
        <span id="discountAmount">0 ₽</span>
      </div>
      
      <div class="cart-total">
        <span>Итого:</span>
        <span id="cartTotal">0 ₽</span>
      </div>
      <button class="checkout-btn" id="goToCheckout">Перейти к оформлению</button>
    </div>
  </div>

  <script>
    // ---------- LOADER ----------
    const loader = document.getElementById("loader");
    window.addEventListener("load", () => {
      setTimeout(() => loader.classList.add("hidden"), 1100);
    });

    // ---------- ЛОГИКА МАГАЗИНА ----------
    const prices = { can: 2600, sample: 0 }; 
    let cart = JSON.parse(localStorage.getItem('shelterCart')) || { can: 0, sample: 0, samplePrice: 0 };
    const MAX_SAMPLES = 10;

    const productData = {
      can: {
        title: "Протеин SHELTER",
        price: "2 600 ₽",
        desc: "Чистый сывороточный протеин с глубоким шоколадным вкусом. Без сахара. 18 г белка на порцию. Идеально для восстановления после тренировок.",
        img: "images/shelter-protein-chocolate.jpg"
      },
      sample: {
        title: "Пробники SHELTER",
        price: "от 100 ₽",
        desc: "Не уверен во вкусе? Возьми порционный пробник (30 г). Попробуй дома и реши, стоит ли брать целую банку.",
        img: "images/probniki.jpg"
      }
    };

    function openModal(type) {
      if (!productData[type]) return;
      const data = productData[type];
      document.getElementById('modalTitle').innerText = data.title;
      document.getElementById('modalPrice').innerText = data.price;
      document.getElementById('modalDesc').innerText = data.desc;
      document.getElementById('modalImg').src = data.img;
      
      const btn = document.getElementById('modalBtn');
      btn.innerText = "Добавить в корзину";
      btn.onclick = (e) => { addToCart(type); closeModal(e); };

      document.getElementById('productModal').classList.add('active');
    }

    function closeModal(e) {
      if (e && e.target !== e.currentTarget && e.target.className !== 'modal-close') return;
      document.getElementById('productModal').classList.remove('active');
    }

    function updateCartUI() {
      let totalCount = cart.can + cart.sample;
      let total = 0;
      let discount = 0;

      if (cart.can > 0) {
        let canPrice = cart.can * prices.can;
        if (cart.can >= 2) discount = Math.round(canPrice * 0.10);
        total += canPrice;
      }
      if (cart.sample > 0) total += cart.samplePrice;
      total -= discount;

      document.getElementById('cartCount').innerText = totalCount;
      document.getElementById('cartTotal').innerText = total.toLocaleString('ru-RU') + ' ₽';
      
      const discountInfo = document.getElementById('discountInfo');
      if (discount > 0) {
        discountInfo.style.display = 'flex';
        document.getElementById('discountAmount').innerText = '-' + discount.toLocaleString('ru-RU') + ' ₽';
      } else {
        discountInfo.style.display = 'none';
      }
      
      const cartItems = document.getElementById('cartItems');
      cartItems.innerHTML = '';
      
      if (cart.can > 0) {
        cartItems.innerHTML += `
          <div class="cart-item">
            <span>Протеин (${cart.can} шт.)</span>
            <div><span>${(cart.can * prices.can).toLocaleString('ru-RU')} ₽</span>
            <button class="remove-item" onclick="removeItem('can')">&times;</button></div>
          </div>`;
      }
      
      if (cart.sample > 0) {
        cartItems.innerHTML += `
          <div class="cart-item">
            <span>Пробники (${cart.sample} шт.)</span>
            <div><span>${cart.samplePrice.toLocaleString('ru-RU')} ₽</span>
            <button class="remove-item" onclick="removeItem('sample')">&times;</button></div>
          </div>`;
      }
      
      if (totalCount === 0) {
        cartItems.innerHTML = '<p style="color: gray; text-align: center; margin-top: 20px;">Корзина пуста</p>';
      }
      localStorage.setItem('shelterCart', JSON.stringify(cart));
    }

    function changeQty(type, delta) {
      if (type === 'sample') return; 
      let input = document.getElementById('qty-' + type);
      let newVal = parseInt(input.value) + delta;
      if (newVal >= 1 && newVal <= 99) input.value = newVal;
    }

    function addToCart(type) {
      if (type === 'can') {
        let qty = parseInt(document.getElementById('qty-can').value);
        cart.can += qty;
        document.getElementById('qty-can').value = 1;
      } 
      else if (type === 'sample') {
        let select = document.getElementById('sample-type');
        let qty = parseInt(select.value);
        if (cart.sample + qty > MAX_SAMPLES) {
          alert(`В корзину можно добавить не более ${MAX_SAMPLES} пробников!`);
          return;
        }
        cart.sample += qty;
        if (qty === 1) cart.samplePrice += 100;
        if (qty === 5) cart.samplePrice += 450;
        if (qty === 10) cart.samplePrice += 900;
      }
      updateCartUI();
      const cartBtn = document.getElementById('openCart');
      cartBtn.style.transform = 'scale(1.1)';
      setTimeout(() => cartBtn.style.transform = 'scale(1)', 200);
    }

    function removeItem(type) {
      if (type === 'can') cart.can = 0;
      else { cart.sample = 0; cart.samplePrice = 0; }
      updateCartUI();
    }

    document.getElementById('openCart').onclick = () => document.getElementById('cartModal').classList.add('active');
    document.getElementById('closeCart').onclick = () => document.getElementById('cartModal').classList.remove('active');

    document.getElementById('goToCheckout').onclick = () => {
      if (cart.can + cart.sample === 0) return alert('Корзина пуста!');
      document.getElementById('cartModal').classList.remove('active');
      document.getElementById('productsView').style.display = 'none';
      document.getElementById('checkoutView').classList.add('active');
      window.scrollTo(0, 0);
    };

    document.getElementById('orderForm').onsubmit = (e) => {
      e.preventDefault();
      const inputs = e.target.querySelectorAll('input');
      let isValid = true;

      inputs.forEach(input => {
        if (!input.value.trim()) {
          input.classList.add('error');
          isValid = false;
        } else {
          input.classList.remove('error');
        }
      });

      if (!isValid) return;

      const formData = new FormData(e.target);
      const orderDetails = `
        Клиент: ${formData.get('name')}
        Телефон: ${formData.get('phone')}
        Email: ${formData.get('email')}
        Адрес: ${formData.get('address')}
        ---
        Заказ: Протеин - ${cart.can} шт., Пробники - ${cart.sample} шт.
        Итого к оплате: ${document.getElementById('cartTotal').innerText}
      `;
      
      alert('Данные собраны! Здесь будет интеграция с оплатой.\n\n' + orderDetails);
      cart = { can: 0, sample: 0, samplePrice: 0 };
      updateCartUI();
      window.location.href = "index.html";
    };

    document.querySelectorAll('#orderForm input').forEach(input => {
      input.addEventListener('input', () => input.classList.remove('error'));
    });

    updateCartUI();
  </script>
</body>
</html>
