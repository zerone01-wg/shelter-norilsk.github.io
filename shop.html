<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHELTER — Магазин</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #1958ff; --black: #0a0a0a; --gray: #707070; --white: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.5);
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Красивый фон для стеклянного эффекта */
    body { 
      font-family: "Manrope", sans-serif; 
      background: linear-gradient(135deg, #e0eaff 0%, #f4f6fb 100%);
      color: var(--black);
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    .container { width: min(1240px, calc(100% - 48px)); margin: 0 auto; }

    /* Header */
    .header { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); color: var(--white); padding: 20px 0; position: sticky; top: 0; z-index: 50; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: "Unbounded", sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.08em; }
    .nav { display: flex; gap: 20px; align-items: center; }
    .nav a { font-weight: 700; font-size: 14px; }
    
    .cart-btn { 
      background: var(--blue); color: var(--white); padding: 10px 20px; border-radius: 8px; 
      font-weight: 800; display: flex; align-items: center; gap: 10px; cursor: pointer; border: none;
      transition: transform 0.2s;
    }
    .cart-btn:hover { transform: translateY(-2px); }
    .cart-count { background: var(--white); color: var(--blue); border-radius: 50%; padding: 2px 8px; font-size: 12px; min-width: 22px; text-align: center; }

    /* Стеклянные карточки товаров */
    .products-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 30px; 
      padding: 60px 0; 
      max-width: 900px; /* Чтобы не были громоздкими на ПК */
      margin: 0 auto;
    }
    
    .product-card { 
      background: var(--glass-bg); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px; 
      padding: 40px 30px; 
      box-shadow: 0 20px 40px rgba(12, 35, 95, 0.08);
      text-align: center; 
      transition: transform 0.3s var(--ease), box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 30px 50px rgba(12, 35, 95, 0.12); }
    
    /* Место под твои картинки */
    .product-img { 
      width: 160px; 
      height: 160px; 
      margin: 0 auto 20px; 
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(240,244,255,0.5));
      border-radius: 30px; 
      display: flex; align-items: center; justify-content: center; 
      font-size: 60px;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.8);
    }
    
    .product-title { font-family: "Unbounded", sans-serif; font-size: 18px; margin-bottom: 10px; }
    .product-price { font-size: 22px; font-weight: 800; color: var(--blue); margin-bottom: 25px; }
    
    .qty-controls { 
      display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 25px;
      background: rgba(255,255,255,0.5); border-radius: 12px; padding: 5px; width: fit-content; margin: 0 auto 25px auto;
    }
    .qty-btn { 
      width: 36px; height: 36px; border: none; background: var(--white); 
      font-size: 20px; cursor: pointer; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: background 0.2s;
    }
    .qty-btn:hover { background: var(--light); }
    .qty-input { width: 40px; text-align: center; font-size: 16px; font-weight: 700; border: none; background: transparent; }
    
    .add-to-cart { 
      width: 100%; padding: 16px; background: var(--blue); color: var(--white); 
      border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 15px;
      transition: background 0.2s, transform 0.2s;
    }
    .add-to-cart:hover { background: #1045d6; transform: translateY(-2px); }

    /* Корзина (Боковая панель) */
    .cart-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; justify-content: flex-end; z-index: 100; opacity: 0; transition: opacity 0.3s; }
    .cart-modal.active { display: flex; opacity: 1; }
    
    .cart-content { 
      background: var(--white); width: 400px; max-width: 100%; height: 100%; 
      padding: 30px; display: flex; flex-direction: column; 
      transform: translateX(100%); transition: transform 0.4s var(--ease);
      box-shadow: -10px 0 30px rgba(0,0,0,0.1);
    }
    .cart-modal.active .cart-content { transform: translateX(0); }
    
    .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .close-cart { background: none; border: none; font-size: 30px; cursor: pointer; color: var(--gray); }
    
    .cart-items { flex-grow: 1; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee; font-size: 15px; }
    
    .cart-total { font-size: 22px; font-weight: 800; margin: 20px 0; display: flex; justify-content: space-between; border-top: 2px solid #eee; padding-top: 20px; }
    .checkout-btn { background: var(--black); color: var(--white); padding: 18px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; transition: background 0.2s; }
    .checkout-btn:hover { background: #333; }

    /* Форма */
    .checkout-section { display: none; padding: 60px 0; max-width: 600px; margin: 0 auto; }
    .checkout-section.active { display: block; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
    .form-group input { width: 100%; padding: 16px; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; font-family: inherit; background: var(--white); }
    .form-group input:focus { outline: none; border-color: var(--blue); }
    .submit-order { background: var(--blue); color: var(--white); padding: 18px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 20px; font-size: 16px; }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">SHELTER</a>
      <div class="nav">
        <a href="index.html">На главную</a>
        <button class="cart-btn" id="openCart">
          Корзина <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- ТОВАРЫ -->
    <div class="products-grid" id="productsView">
      <!-- Банка -->
      <div class="product-card">
        <div class="product-img" id="icon-can">🍫</div> <!-- Замени на <img> -->
        <h3 class="product-title">Протеин SHELTER</h3>
        <div class="product-price">2 600 ₽</div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty('can', -1)">-</button>
          <input type="text" class="qty-input" id="qty-can" value="1" readonly>
          <button class="qty-btn" onclick="changeQty('can', 1)">+</button>
        </div>
        <button class="add-to-cart" onclick="addToCart('can')">В корзину</button>
      </div>

      <!-- Пробник -->
      <div class="product-card">
        <div class="product-img" id="icon-sample">🥤</div> <!-- Замени на <img> -->
        <h3 class="product-title">Пробник (1 порция)</h3>
        <div class="product-price">100 ₽</div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty('sample', -1)">-</button>
          <input type="text" class="qty-input" id="qty-sample" value="1" readonly>
          <button class="qty-btn" onclick="changeQty('sample', 1)">+</button>
        </div>
        <button class="add-to-cart" onclick="addToCart('sample')">В корзину</button>
      </div>
    </div>

    <!-- ФОРМА ОФОРМЛЕНИЯ -->
    <div class="checkout-section" id="checkoutView">
      <h2 style="font-family: 'Unbounded'; margin-bottom: 30px; text-align: center;">Оформление заказа</h2>
      <form id="orderForm">
        <div class="form-group">
          <label>ФИО</label>
          <input type="text" name="name" required placeholder="Иванов Иван Иванович">
        </div>
        <div class="form-group">
          <label>Номер телефона</label>
          <input type="tel" name="phone" required placeholder="+7 (999) 999-99-99">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required placeholder="mail@example.com">
        </div>
        <div class="form-group">
          <label>Адрес проживания</label>
          <input type="text" name="address" required placeholder="Город, улица, дом, квартира">
        </div>
        <button type="submit" class="submit-order">Перейти к оплате</button>
      </form>
    </div>
  </main>

  <!-- КОРЗИНА -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <div class="cart-header">
        <h3 style="font-family: 'Unbounded';">Корзина</h3>
        <button class="close-cart" id="closeCart">&times;</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-total">
        <span>Итого:</span>
        <span id="cartTotal">0 ₽</span>
      </div>
      <button class="checkout-btn" id="goToCheckout">Перейти к оформлению</button>
    </div>
  </div>

  <script>
    const prices = { can: 2600, sample: 100 };
    let cart = JSON.parse(localStorage.getItem('shelterCart')) || { can: 0, sample: 0 };

    // Обновление интерфейса корзины и счетчика
    function updateCartUI() {
      let count = cart.can + cart.sample;
      let total = (cart.can * prices.can) + (cart.sample * prices.sample);
      
      // Меняем число в шапке сайта
      document.getElementById('cartCount').innerText = count;
      document.getElementById('cartTotal').innerText = total.toLocaleString('ru-RU') + ' ₽';
      
      // Обновляем список внутри корзины
      const cartItems = document.getElementById('cartItems');
      cartItems.innerHTML = '';
      if (cart.can > 0) cartItems.innerHTML += `<div class="cart-item"><span>Протеин (${cart.can} шт.)</span><span>${(cart.can * prices.can).toLocaleString('ru-RU')} ₽</span></div>`;
      if (cart.sample > 0) cartItems.innerHTML += `<div class="cart-item"><span>Пробник (${cart.sample} шт.)</span><span>${(cart.sample * prices.sample).toLocaleString('ru-RU')} ₽</span></div>`;
      if (count === 0) cartItems.innerHTML = '<p style="color: gray; text-align: center; margin-top: 20px;">Корзина пуста</p>';

      localStorage.setItem('shelterCart', JSON.stringify(cart));
    }

    function changeQty(type, delta) {
      let input = document.getElementById('qty-' + type);
      let newVal = parseInt(input.value) + delta;
      if (newVal >= 1 && newVal <= 99) input.value = newVal;
    }

    // ДОБАВЛЕНИЕ В КОРЗИНУ (без всплывания панели)
    function addToCart(type) {
      let qty = parseInt(document.getElementById('qty-' + type).value);
      cart[type] += qty;
      updateCartUI();
      
      // Легкая анимация кнопки корзины в шапке
      const cartBtn = document.getElementById('openCart');
      cartBtn.style.transform = 'scale(1.1)';
      setTimeout(() => cartBtn.style.transform = 'scale(1)', 200);
      
      // Сбрасываем селектор количества обратно на 1
      document.getElementById('qty-' + type).value = 1;
    }

    // Открытие/закрытие корзины
    document.getElementById('openCart').onclick = () => document.getElementById('cartModal').classList.add('active');
    document.getElementById('closeCart').onclick = () => document.getElementById('cartModal').classList.remove('active');

    // Переход к форме
    document.getElementById('goToCheckout').onclick = () => {
      if (cart.can + cart.sample === 0) return alert('Корзина пуста!');
      document.getElementById('cartModal').classList.remove('active');
      document.getElementById('productsView').style.display = 'none';
      document.getElementById('checkoutView').classList.add('active');
    };

    // Отправка формы
    document.getElementById('orderForm').onsubmit = (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      
      const orderDetails = `
        Клиент: ${formData.get('name')}
        Телефон: ${formData.get('phone')}
        Email: ${formData.get('email')}
        Адрес: ${formData.get('address')}
        ---
        Заказ: Протеин - ${cart.can} шт., Пробники - ${cart.sample} шт.
        Итого к оплате: ${document.getElementById('cartTotal').innerText}
      `;
      
      alert('Данные собраны! Здесь будет переход на оплату.\n\n' + orderDetails);
      
      cart = { can: 0, sample: 0 };
      updateCartUI();
      window.location.href = "index.html";
    };

    updateCartUI();
  </script>
</body>
</html>
