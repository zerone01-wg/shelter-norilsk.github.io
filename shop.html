<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHELTER — Магазин</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #1958ff; --black: #0a0a0a; --gray: #707070; --light: #f4f6fb; --line: #dedede; --white: #ffffff;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Manrope", sans-serif; background: var(--light); color: var(--black); }
    a { text-decoration: none; color: inherit; }
    .container { width: min(1240px, calc(100% - 48px)); margin: 0 auto; }

    /* Header */
    .header { background: var(--black); color: var(--white); padding: 20px 0; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: "Unbounded", sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.08em; }
    .nav { display: flex; gap: 20px; align-items: center; }
    .nav a { font-weight: 700; font-size: 14px; }
    .cart-btn { background: var(--blue); color: var(--white); padding: 10px 20px; border-radius: 4px; font-weight: 800; display: flex; align-items: center; gap: 10px; cursor: pointer; border: none; }
    .cart-count { background: var(--white); color: var(--blue); border-radius: 50%; padding: 2px 8px; font-size: 12px; }

    /* Products */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 60px 0; }
    .product-card { background: var(--white); border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
    .product-img { width: 200px; height: 200px; margin: 0 auto 20px; background: var(--light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 80px; }
    .product-title { font-family: "Unbounded", sans-serif; font-size: 20px; margin-bottom: 10px; }
    .product-price { font-size: 24px; font-weight: 800; color: var(--blue); margin-bottom: 20px; }
    
    .qty-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; }
    .qty-btn { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--white); font-size: 20px; cursor: pointer; border-radius: 4px; }
    .qty-input { width: 50px; text-align: center; font-size: 18px; font-weight: 700; border: none; }
    .add-to-cart { width: 100%; padding: 15px; background: var(--blue); color: var(--white); border: none; border-radius: 4px; font-weight: 800; cursor: pointer; }

    /* Cart Modal */
    .cart-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: flex-end; z-index: 100; }
    .cart-modal.active { display: flex; }
    .cart-content { background: var(--white); width: 400px; height: 100%; padding: 30px; display: flex; flex-direction: column; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s var(--ease); }
    .cart-modal.active .cart-content { transform: translateX(0); }
    .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .close-cart { background: none; border: none; font-size: 30px; cursor: pointer; }
    .cart-items { flex-grow: 1; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
    .cart-total { font-size: 24px; font-weight: 800; margin: 20px 0; display: flex; justify-content: space-between; }
    .checkout-btn { background: var(--black); color: var(--white); padding: 18px; border: none; border-radius: 4px; font-weight: 800; cursor: pointer; width: 100%; }

    /* Checkout Form */
    .checkout-section { display: none; padding: 60px 0; }
    .checkout-section.active { display: block; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 700; }
    .form-group input { width: 100%; padding: 15px; border: 1px solid var(--line); border-radius: 4px; font-family: inherit; }
    .submit-order { background: var(--blue); color: var(--white); padding: 18px; border: none; border-radius: 4px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">SHELTER</a>
      <div class="nav">
        <a href="index.html">На главную</a>
        <button class="cart-btn" id="openCart">
          Корзина <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- ТОВАРЫ -->
    <div class="products-grid" id="productsView">
      <!-- Товар 1 -->
      <div class="product-card">
        <div class="product-img">🍫</div>
        <h3 class="product-title">Протеин SHELTER</h3>
        <div class="product-price">2 600 ₽</div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty('can', -1)">-</button>
          <input type="text" class="qty-input" id="qty-can" value="1" readonly>
          <button class="qty-btn" onclick="changeQty('can', 1)">+</button>
        </div>
        <button class="add-to-cart" onclick="addToCart('can')">Добавить в корзину</button>
      </div>

      <!-- Товар 2 -->
      <div class="product-card">
        <div class="product-img">🥤</div>
        <h3 class="product-title">Пробник (1 порция)</h3>
        <div class="product-price">100 ₽</div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty('sample', -1)">-</button>
          <input type="text" class="qty-input" id="qty-sample" value="1" readonly>
          <button class="qty-btn" onclick="changeQty('sample', 1)">+</button>
        </div>
        <button class="add-to-cart" onclick="addToCart('sample')">Добавить в корзину</button>
      </div>
    </div>

    <!-- АНКЕТА -->
    <div class="checkout-section" id="checkoutView">
      <h2 style="font-family: 'Unbounded'; margin-bottom: 30px;">Оформление заказа</h2>
      <form id="orderForm">
        <div class="form-group">
          <label>ФИО</label>
          <input type="text" name="name" required placeholder="Иванов Иван Иванович">
        </div>
        <div class="form-group">
          <label>Номер телефона</label>
          <input type="tel" name="phone" required placeholder="+7 (999) 999-99-99">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required placeholder="mail@example.com">
        </div>
        <div class="form-group">
          <label>Адрес проживания</label>
          <input type="text" name="address" required placeholder="Город, улица, дом, квартира">
        </div>
        <button type="submit" class="submit-order">Перейти к оплате</button>
      </form>
    </div>
  </main>

  <!-- КОРЗИНА -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <div class="cart-header">
        <h3 style="font-family: 'Unbounded';">Корзина</h3>
        <button class="close-cart" id="closeCart">&times;</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-total">
        <span>Итого:</span>
        <span id="cartTotal">0 ₽</span>
      </div>
      <button class="checkout-btn" id="goToCheckout">Перейти к оформлению</button>
    </div>
  </div>

  <script>
    // --- ЛОГИКА КОРЗИНЫ ---
    const prices = { can: 2600, sample: 100 };
    let cart = JSON.parse(localStorage.getItem('shelterCart')) || { can: 0, sample: 0 };

    function updateCartUI() {
      let count = cart.can + cart.sample;
      let total = (cart.can * prices.can) + (cart.sample * prices.sample);
      
      document.getElementById('cartCount').innerText = count;
      document.getElementById('cartTotal').innerText = total.toLocaleString('ru-RU') + ' ₽';
      
      const cartItems = document.getElementById('cartItems');
      cartItems.innerHTML = '';
      if (cart.can > 0) cartItems.innerHTML += `<div class="cart-item"><span>Протеин (${cart.can} шт.)</span><span>${cart.can * prices.can} ₽</span></div>`;
      if (cart.sample > 0) cartItems.innerHTML += `<div class="cart-item"><span>Пробник (${cart.sample} шт.)</span><span>${cart.sample * prices.sample} ₽</span></div>`;
      if (count === 0) cartItems.innerHTML = '<p style="color: gray">Корзина пуста</p>';

      localStorage.setItem('shelterCart', JSON.stringify(cart));
    }

    function changeQty(type, delta) {
      let input = document.getElementById('qty-' + type);
      let newVal = parseInt(input.value) + delta;
      if (newVal >= 1 && newVal <= 99) input.value = newVal;
    }

    function addToCart(type) {
      let qty = parseInt(document.getElementById('qty-' + type).value);
      cart[type] += qty;
      updateCartUI();
      document.getElementById('openCart').click(); // Открыть корзину
    }

    // --- ОТКРЫТИЕ/ЗАКРЫТИЕ КОРЗИНЫ ---
    document.getElementById('openCart').onclick = () => document.getElementById('cartModal').classList.add('active');
    document.getElementById('closeCart').onclick = () => document.getElementById('cartModal').classList.remove('active');

    // --- ПЕРЕХОД К ОФОРМЛЕНИЮ ---
    document.getElementById('goToCheckout').onclick = () => {
      if (cart.can + cart.sample === 0) return alert('Корзина пуста!');
      document.getElementById('cartModal').classList.remove('active');
      document.getElementById('productsView').style.display = 'none';
      document.getElementById('checkoutView').classList.add('active');
    };

    // --- ОТПРАВКА ФОРМЫ ---
    document.getElementById('orderForm').onsubmit = (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      
      // Собираем текст для письма (в реальности нужно настроить Formspree)
      const orderDetails = `
        Клиент: ${formData.get('name')}
        Телефон: ${formData.get('phone')}
        Email: ${formData.get('email')}
        Адрес: ${formData.get('address')}
        ---
        Заказ: Протеин - ${cart.can} шт., Пробники - ${cart.sample} шт.
        Итого к оплате: ${document.getElementById('cartTotal').innerText}
      `;
      
      alert('Форма отправлена! (Здесь будет интеграция с отправкой почты и оплатой)\n\n' + orderDetails);
      
      // Очистка корзины
      cart = { can: 0, sample: 0 };
      updateCartUI();
      window.location.href = "index.html";
    };

    // Инициализация
    updateCartUI();
  </script>
</body>
</html>
